apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: spring-petclinic
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: spring-petclinic
  namespaceSelector:
    matchNames:
    - petclinic
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 15s
