apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: spring-petclinic
  namespace: monitoring
  labels:
    release: prometheus  # 必须匹配 Prometheus 的 serviceMonitorSelector
spec:
  selector:
    matchLabels:
      app: spring-petclinic  # 必须和你的 Service 的 label 一致
  namespaceSelector:
    matchNames:
    - petclinic
  endpoints:
  - port: http  # 必须和 Service 的 port name 一致
    path: /actuator/prometheus
    interval: 15s
