---
- name: 配置 Kubernetes 主节点
  hosts: k8s_masters
  become: yes
  tasks:
    - name: 设置节点主机名
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"
      # 注释：将节点主机名设置为 Ansible 库存中的主机名

    - name: 添加 Docker CE 和 Kubernetes 仓库
      ansible.builtin.shell:
        cmd: |
          yum-config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
          cat <<EOF > /etc/yum.repos.d/kubernetes.repo
          [kubernetes]
          name=Kubernetes
          baseurl=https://mirrors.aliyun.com/kubernetes/yum/repos/kubernetes-el7-x86_64/
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=https://mirrors.aliyun.com/kubernetes/yum/doc/yum-key.gpg https://mirrors.aliyun.com/kubernetes/yum/doc/rpm-package-key.gpg
          EOF
      changed_when: true
      # 注释：配置软件源

    - name: 禁用 swap 并注释 fstab 中的 swap 行
      ansible.builtin.shell:
        cmd: |
          swapoff -a
          sed -i '/\sswap\s/s/^/#/' /etc/fstab
      changed_when: true
      # 注释：禁用 swap 以满足 Kubernetes 要求

    - name: 配置内核模块和 sysctl 设置
      ansible.builtin.copy:
        dest: "{{ item.dest }}"
        content: "{{ item.content }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - dest: /etc/modules-load.d/k8s.conf
          content: |
            overlay
            br_netfilter
        - dest: /etc/sysctl.d/k8s.conf
          content: |
            net.bridge.bridge-nf-call-iptables  = 1
            net.bridge.bridge-nf-call-ip6tables = 1
            net.ipv4.ip_forward                 = 1
      # 注释：持久化内核模块和网络设置

    - name: 加载内核模块并应用 sysctl 设置
      ansible.builtin.shell:
        cmd: |
          modprobe overlay
          modprobe br_netfilter
          sysctl --system
      changed_when: false
      # 注释：确保模块加载和 sysctl 参数生效

    - name: 安装必要软件包并更新缓存
      ansible.builtin.dnf:
        name:
          - yum-utils
          - device-mapper-persistent-data
          - lvm2
          - containerd.io
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes
        use_backend: dnf4
      # 注释：安装依赖和 Kubernetes 组件

    - name: 配置 containerd
      ansible.builtin.shell:
        cmd: |
          mkdir -p /etc/containerd
          containerd config default > /etc/containerd/config.toml
          sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml
      changed_when: true
      notify: 重启 containerd
      # 注释：生成 containerd 配置并启用 SystemdCgroup

    - name: 确保 containerd 运行
      ansible.builtin.systemd:
        name: containerd
        state: started
        enabled: yes
      retries: 3
      delay: 5
      register: containerd_start
      until: containerd_start.status.ActiveState == "active"
      # 注释：确保 containerd 服务启动并运行

    - name: 等待 containerd 套接字
      ansible.builtin.wait_for:
        path: /var/run/containerd/containerd.sock
        state: present
        timeout: 30
      retries: 3
      delay: 5
      # 注释：确保 containerd 套接字可用，防止拉取镜像失败

    - name: 预拉取 Kubernetes 镜像
      ansible.builtin.command:
        cmd: kubeadm config images pull --image-repository=registry.aliyuncs.com/google_containers --cri-socket=unix:///var/run/containerd/containerd.sock
      changed_when: true
      # 注释：拉取 Kubernetes 所需镜像

    - name: 获取节点 IP 地址
      ansible.builtin.shell:
        cmd: ip a | grep 'inet ' | grep -v '127.0.0.1' | awk '{print $2}' | cut -d'/' -f1 | head -n 1
      register: node_ip
      changed_when: false
      # 注释：动态获取节点 IP，避免硬编码

    - name: 初始化 Kubernetes 集群
      ansible.builtin.command:
        cmd: >
          kubeadm init
          --apiserver-advertise-address={{ node_ip.stdout }}
          --apiserver-cert-extra-sans={{ ansible_host }}
          --pod-network-cidr=192.168.0.0/16
          --image-repository=registry.aliyuncs.com/google_containers
          --cri-socket=unix:///var/run/containerd/containerd.sock
      register: kubeadm_init_result
      retries: 3
      delay: 10
      until: kubeadm_init_result.rc == 0
      changed_when: true
      # 注释：初始化 Kubernetes 集群

    - name: 提取完整的 kubeadm join 命令
      ansible.builtin.shell:
        cmd: kubeadm token create --print-join-command
      register: join_command_result
      when: kubeadm_init_result.rc == 0
      # 注释：使用 kubeadm token create 直接生成 join 命令

    - name: 设置最终 join 命令
      ansible.builtin.set_fact:
        kubeadm_join_command: "{{ join_command_result.stdout | trim }}"
      when: join_command_result.rc == 0
      # 注释：保存提取的 join 命令

    - name: 在控制机上创建保存目录
      ansible.builtin.file:
        path: "./kubeadm-join-commands"
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true
      # 注释：创建保存 join 命令的目录

    - name: 在控制机上保存 join 命令
      ansible.builtin.copy:
        content: |
          # Kubernetes join command for {{ inventory_hostname }}
          # Generated at {{ ansible_date_time.iso8601 }}
          {{ kubeadm_join_command }}
          
          # 使用示例：
          # {{ kubeadm_join_command }}
        dest: "./kubeadm-join-commands/{{ inventory_hostname }}-join-command.sh"
        owner: root
        group: root
        mode: '0755'
      delegate_to: localhost
      run_once: true
      when: kubeadm_join_command != '' and kubeadm_join_command is defined
      # 注释：将 join 命令保存到控制机上的文件中

    - name: 调试显示提取的 join 命令
      ansible.builtin.debug:
        msg: "提取的 join 命令: {{ kubeadm_join_command }}"
      when: kubeadm_join_command != '' and kubeadm_join_command is defined
      # 注释：调试用，确认命令提取正确

    - name: 配置主节点 /etc/hosts 以解析 worker 节点
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ hostvars[item]['ansible_host'] }} {{ item }}"
        state: present
      loop: "{{ groups['k8s_workers'] }}"
      # 注释：动态添加 worker 节点的 IP 和主机名到主节点的 /etc/hosts

    - name: 配置 kubectl
      ansible.builtin.shell:
        cmd: |
          mkdir -p $HOME/.kube
          cp -f /etc/kubernetes/admin.conf $HOME/.kube/config
          chown $(id -u):$(id -g) $HOME/.kube/config
      changed_when: true
      when: kubeadm_init_result.rc == 0
      # 注释：设置 kubeconfig 以便使用 kubectl

    - name: 从主节点拉取 kubeconfig 到控制机
      ansible.builtin.fetch:
        src: /root/.kube/config
        dest: "./kubeadm-join-commands/{{ inventory_hostname }}-kubeconfig"
        flat: yes
      when: kubeadm_init_result.rc == 0
      # 注释：将主节点的 kubeconfig 保存到控制机的 kubeadm-join-commands 目录

    - name: 安装 Calico CNI 插件
      ansible.builtin.command:
        cmd: kubectl apply -f https://docs.projectcalico.org/manifests/calico.yaml
      environment:
        KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"
      changed_when: true
      when: kubeadm_init_result.rc == 0
      # 注释：部署 Calico 网络插件

    - name: 检查集群节点状态
      ansible.builtin.shell:
        cmd: kubectl get nodes
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"
      register: node_status
      changed_when: false
      when: kubeadm_init_result.rc == 0
      # 注释：验证集群节点状态

    - name: 显示集群状态
      ansible.builtin.debug:
        msg: "集群状态：\n{{ node_status.stdout_lines | default(['无输出']) }}"
      when: node_status.stdout is defined
      # 注释：输出集群状态

  handlers:
    - name: 重启 containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        enabled: yes
      # 注释：containerd 配置更改后重启服务
