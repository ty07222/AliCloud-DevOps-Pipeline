---
- name: 配置 Kubernetes Worker 节点
  hosts: k8s_workers
  become: yes
  vars:
    master_host: "master1"
    join_command_file: "./kubeadm-join-commands/{{ master_host }}-join-command.sh"  
  tasks:
    - name: 设置节点主机名
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: 添加 Docker CE 和 Kubernetes 仓库
      ansible.builtin.shell:
        cmd: |
          yum-config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
          cat <<EOF > /etc/yum.repos.d/kubernetes.repo
          [kubernetes]
          name=Kubernetes
          baseurl=https://mirrors.aliyun.com/kubernetes/yum/repos/kubernetes-el7-x86_64/
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=https://mirrors.aliyun.com/kubernetes/yum/doc/yum-key.gpg https://mirrors.aliyun.com/kubernetes/yum/doc/rpm-package-key.gpg
          EOF
      changed_when: true

    - name: 禁用 swap 并注释 fstab 中的 swap 行
      ansible.builtin.shell:
        cmd: |
          swapoff -a
          sed -i '/\sswap\s/s/^/#/' /etc/fstab
      changed_when: true

    - name: 配置内核模块和 sysctl 设置
      ansible.builtin.copy:
        dest: "{{ item.dest }}"
        content: "{{ item.content }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - dest: /etc/modules-load.d/k8s.conf
          content: |
            overlay
            br_netfilter
        - dest: /etc/sysctl.d/k8s.conf
          content: |
            net.bridge.bridge-nf-call-iptables  = 1
            net.bridge.bridge-nf-call-ip6tables = 1
            net.ipv4.ip_forward                 = 1

    - name: 加载内核模块并应用 sysctl 设置
      ansible.builtin.shell:
        cmd: |
          modprobe overlay
          modprobe br_netfilter
          sysctl --system
      changed_when: false

    - name: 安装必要软件包并更新缓存
      ansible.builtin.dnf:
        name:
          - yum-utils
          - device-mapper-persistent-data
          - lvm2
          - containerd.io
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes
        use_backend: dnf4

    - name: 配置 containerd
      ansible.builtin.shell:
        cmd: |
          mkdir -p /etc/containerd
          containerd config default > /etc/containerd/config.toml
          sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml
      changed_when: true
      notify: 重启 containerd

    - name: 确保 containerd 运行
      ansible.builtin.systemd:
        name: containerd
        state: started
        enabled: yes
      retries: 3
      delay: 5
      register: containerd_start
      until: containerd_start.status.ActiveState == "active"

    - name: 等待 containerd 套接字
      ansible.builtin.wait_for:
        path: /var/run/containerd/containerd.sock
        state: present
        timeout: 30
      retries: 3
      delay: 5

    - name: 预拉取 Kubernetes 镜像
      ansible.builtin.command:
        cmd: kubeadm config images pull --image-repository=registry.aliyuncs.com/google_containers --cri-socket=unix:///var/run/containerd/containerd.sock
      changed_when: true

    - name: 从控制机读取 join 命令文件
      ansible.builtin.slurp:
        src: "{{ join_command_file }}"
      register: join_file_content
      delegate_to: localhost

    - name: 提取 join 命令
      ansible.builtin.set_fact:
        kubeadm_join_command: "{{ join_file_content['content'] | b64decode | regex_findall('kubeadm join .+') | first | trim }}"
      when: join_file_content['content'] is defined

    - name: 执行 kubeadm join 加入集群
      ansible.builtin.command:
        cmd: "{{ kubeadm_join_command }} --cri-socket=unix:///var/run/containerd/containerd.sock"
      register: kubeadm_join_result
      retries: 3
      delay: 10
      until: kubeadm_join_result.rc == 0
      changed_when: true
      when: kubeadm_join_command is defined

    - name: 在 worker 节点创建 .kube 目录
      ansible.builtin.file:
        path: ~/.kube
        state: directory
        mode: '0755'

    - name: 从控制机复制 kubeconfig 到 worker 节点
      ansible.builtin.copy:
        src: "./kubeadm-join-commands/{{ master_host }}-kubeconfig"
        dest: ~/.kube/config
        owner: root
        group: root
        mode: '0644'

    - name: 设置 kubeconfig 权限
      ansible.builtin.shell:
        cmd: chown $(id -u):$(id -g) ~/.kube/config
      changed_when: true

    - name: 检查集群节点状态
      ansible.builtin.shell:
        cmd: kubectl get nodes
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"
      register: node_status
      changed_when: false

    - name: 显示集群状态
      ansible.builtin.debug:
        msg: "集群状态：\n{{ node_status.stdout_lines | default(['无输出']) }}"
      when: node_status.stdout is defined

  handlers:
    - name: 重启 containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        enabled: yes
